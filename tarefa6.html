<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Alunos</title>
    <style>
        :root {
            --primary-color: #007bff;
            --secondary-color: #6c757d;
            --background-color: #f8f9fa;
            --card-background: #ffffff;
            --border-color: #dee2e6;
            --success-color: #28a745;
            --warning-color: #ffc107;
            --danger-color: #dc3545;
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: var(--font-family);
            background-color: var(--background-color);
            color: #333;
            line-height: 1.6;
            padding: 20px;
            display: flex;
            flex-wrap: wrap;  
            
            gap: 20px; 
        }

        h1, h2 {
            color: var(--primary-color);
            text-align: center;
            width: 100%; 
            
            margin-bottom: 30px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }

        
        .form-container {
            background-color: var(--card-background);
            padding: 30px;
            border-radius: 10px;
            box-shadow: var(--box-shadow);
            flex: 1; 
            min-width: 300px; 
            max-width: 450px; 
        
            
            margin: 0 auto; 
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--primary-color);
        }

        .form-group input[type="text"],
        .form-group input[type="number"] {
            width: calc(100% - 20px);
            padding: 12px 10px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            box-sizing: border-box; 
            font-size: 1rem;
            transition: border-color 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
        }

        .form-group input[type="text"]:focus,
        .form-group input[type="number"]:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 8px rgba(0, 123, 255, 0.2);
            outline: none;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: background-color 0.3s ease-in-out, transform 0.2s ease-in-out;
            display: block;
            width: 100%; 
            margin-top: 20px;
        }

        button:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }

        
        .table-container {
            background-color: var(--card-background);
            padding: 30px;
            border-radius: 10px;
            box-shadow: var(--box-shadow);
            flex: 2; 
            
            min-width: 300px;
            overflow-x: auto; 
        }

        table {
            width: 100%;
            border-collapse: separate; 
            border-spacing: 0 15px; 
            
            margin-top: 20px;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid var(--border-color); 
            

        th {
            background-color: var(--primary-color);
            color: white;
            font-weight: bold;
            border-radius: 5px 5px 0 0; 
        }

        td {
            background-color: var(--card-background);
        }

        tr:nth-child(even) {
            
            /* background-color: #f1f1f1; */
        }

        tr:last-child td {
            border-bottom: none;
            border-radius: 0 0 5px 5px;
            
        }

        
        .status-aprovado {
            color: var(--success-color);
            font-weight: bold;
        }

        .status-reprovado {
            color: var(--danger-color);
            font-weight: bold;
        }

        .status-recurso {
            color: var(--warning-color);
            font-weight: bold;
        }

        
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            .form-container, .table-container {
                width: 100%; 
                max-width: none;
                box-sizing: border-box; 
                
        }
    </style>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>

<h1>T6 - Cálculos De Médias de Alunos</h1>

<nav>
<ul>

<li><a href="index.html">Home</a></li>
<li><a href="taref1.html">T1</a></li>
<li><a href="taref2.html">T2</a></li>
<li><a href="tarefa3.html">T3</a></li>
<li><a href="taref4.html">T4</a></li>
<li><a href="tarefa5.html">T5</a></li>
<li><a href="tarefa6.html">T6</a></li>

</ul>
</nav>

    </header>

    <div class="form-container">
        <h2>Cadastro de Aluno</h2>
        <div class="form-group">
            <label for="nomeAluno">Nome do Aluno:</label>
            <input type="text" id="nomeAluno" required>
        </div>
        <div class="form-group">
            <label for="nomeCurso">Nome do Curso:</label>
            <input type="text" id="nomeCurso" required>
        </div>
        <div class="form-group">
            <label for="nomeDisciplina">Nome da Disciplina:</label>
            <input type="text" id="nomeDisciplina" required>
        </div>
        <div class="form-group">
            <label for="numEstudante">Número de Estudante:</label>
            <input type="text" id="numEstudante" required>
        </div>
        <div class="form-group">
            <label for="nota1">Nota 1º Trimestre:</label>
            <input type="number" id="nota1" min="0" max="10" step="0.1" required>
        </div>
        <div class="form-group">
            <label for="nota2">Nota 2º Trimestre:</label>
            <input type="number" id="nota2" min="0" max="10" step="0.1" required>
        </div>
        <div class="form-group">
            <label for="nota3">Nota 3º Trimestre:</label>
            <input type="number" id="nota3" min="0" max="10" step="0.1" required>
        </div>
        <button onclick="adicionarAluno()">Adicionar Aluno</button>
    </div>

    <div class="table-container">
        <h2>Situação dos Alunos</h2>
        <table>
            <thead>
                <tr>
                    <th>Nome do Aluno</th>
                    <th>Curso</th>
                    <th>Disciplina</th>
                    <th>Nº Estudante</th>
                    <th>Média</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="tabelaAlunos">
                <!-- Alunos serão adicionados aqui pelo JavaScript -->
            </tbody>
        </table>
    </div>

    <script>
        let alunos = []; // Array para armazenar os dados dos alunos

        function calcularMedia(n1, n2, n3) {
            return (n1 + n2 + n3) / 3;
        }

        function determinarStatus(media) {
            if (media >= 20.0) {
                return "Aprovado";
            } else if (media >= 7.0) {
                return "Recurso";
            } else {
                return "Reprovado";
            }
        }

        function adicionarAluno() {
            const nomeAluno = document.getElementById('nomeAluno').value;
            const nomeCurso = document.getElementById('nomeCurso').value;
            const nomeDisciplina = document.getElementById('nomeDisciplina').value;
            const numEstudante = document.getElementById('numEstudante').value;
            const nota1 = parseFloat(document.getElementById('nota1').value);
            const nota2 = parseFloat(document.getElementById('nota2').value);
            const nota3 = parseFloat(document.getElementById('nota3').value);

            // Validação básica
            if (!nomeAluno || !nomeCurso || !nomeDisciplina || !numEstudante || isNaN(nota1) || isNaN(nota2) || isNaN(nota3)) {
                alert('Por favor, preencha todos os campos corretamente.');
                return;
            }

            const media = calcularMedia(nota1, nota2, nota3);
            const status = determinarStatus(media);

            const novoAluno = {
                nome: nomeAluno,
                curso: nomeCurso,
                disciplina: nomeDisciplina,
                numero: numEstudante,
                media: media.toFixed(2), 
                status: status
            };

            alunos.push(novoAluno); 
            atualizarTabela(); 
            limparFormulario(); 
        }

        function atualizarTabela() {
            const tbody = document.getElementById('tabelaAlunos');
            tbody.innerHTML = '';

            
            for (let i = 0; i < alunos.length; i++) {
                const aluno = alunos[i];

                const row = tbody.insertRow(); // Cria uma nova linha na tabela

                
                const cellNome = row.insertCell();
                const cellCurso = row.insertCell();
                const cellDisciplina = row.insertCell();
                const cellNumero = row.insertCell();
                const cellMedia = row.insertCell();
                const cellStatus = row.insertCell();

                
                cellNome.textContent = aluno.nome;
                cellCurso.textContent = aluno.curso;
                cellDisciplina.textContent = aluno.disciplina;
                cellNumero.textContent = aluno.numero;
                cellMedia.textContent = aluno.media;

                
                if (aluno.status === "Aprovado") {
                    cellStatus.innerHTML = `<span class="status-aprovado">${aluno.status}</span>`;
                } else if (aluno.status === "Recurso") {
                    cellStatus.innerHTML = `<span class="status-recurso">${aluno.status}</span>`;
                } else {
                    cellStatus.innerHTML = `<span class="status-reprovado">${aluno.status}</span>`;
                }
            }
        }

        function limparFormulario() {
            document.getElementById('nomeAluno').value = '';
            document.getElementById('nomeCurso').value = '';
            document.getElementById('nomeDisciplina').value = '';
            document.getElementById('numEstudante').value = '';
            document.getElementById('nota1').value = '';
            document.getElementById('nota2').value = '';
            document.getElementById('nota3').value = '';
        }

        
        window.onload = () => {
            atualizarTabela(); 
        };
    </script>
</body>
</html>
